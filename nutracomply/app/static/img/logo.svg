<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 68" width="300" height="68">
  <!--
    RegBite logo — dot-matrix mark + wordmark
    Mark: 5×5 radial depth grid (centre dot largest, edges fade)
    Text: bold rounded sans-serif lowercase "regbite"
  -->

  <!-- ── Dot matrix (5 cols × 5 rows, 14 px pitch, centre at col 2 row 2) ── -->

  <!-- Row 0  y=4 -->
  <circle cx="8"  cy="4"  r="1.5" fill="#111" opacity="0.25"/>
  <circle cx="22" cy="4"  r="2"   fill="#111" opacity="0.32"/>
  <circle cx="36" cy="4"  r="3"   fill="#111" opacity="0.48"/>
  <circle cx="50" cy="4"  r="2"   fill="#111" opacity="0.32"/>
  <circle cx="64" cy="4"  r="1.5" fill="#111" opacity="0.25"/>

  <!-- Row 1  y=18 -->
  <circle cx="8"  cy="18" r="2"   fill="#111" opacity="0.32"/>
  <circle cx="22" cy="18" r="4.5" fill="#111" opacity="0.68"/>
  <circle cx="36" cy="18" r="6"   fill="#111" opacity="0.84"/>
  <circle cx="50" cy="18" r="4.5" fill="#111" opacity="0.68"/>
  <circle cx="64" cy="18" r="2"   fill="#111" opacity="0.32"/>

  <!-- Row 2  y=34  (centre row) -->
  <circle cx="8"  cy="34" r="3"   fill="#111" opacity="0.48"/>
  <circle cx="22" cy="34" r="6"   fill="#111" opacity="0.84"/>
  <circle cx="36" cy="34" r="8.5" fill="#111" opacity="1"   />
  <circle cx="50" cy="34" r="6"   fill="#111" opacity="0.84"/>
  <circle cx="64" cy="34" r="3"   fill="#111" opacity="0.48"/>

  <!-- Row 3  y=50 -->
  <circle cx="8"  cy="50" r="2"   fill="#111" opacity="0.32"/>
  <circle cx="22" cy="50" r="4.5" fill="#111" opacity="0.68"/>
  <circle cx="36" cy="50" r="6"   fill="#111" opacity="0.84"/>
  <circle cx="50" cy="50" r="4.5" fill="#111" opacity="0.68"/>
  <circle cx="64" cy="50" r="2"   fill="#111" opacity="0.32"/>

  <!-- Row 4  y=64 -->
  <circle cx="8"  cy="64" r="1.5" fill="#111" opacity="0.25"/>
  <circle cx="22" cy="64" r="2"   fill="#111" opacity="0.32"/>
  <circle cx="36" cy="64" r="3"   fill="#111" opacity="0.48"/>
  <circle cx="50" cy="64" r="2"   fill="#111" opacity="0.32"/>
  <circle cx="64" cy="64" r="1.5" fill="#111" opacity="0.25"/>

  <!-- ── Wordmark ── -->
  <text
    x="82" y="52"
    font-family="'Nunito','Quicksand','Trebuchet MS','Arial Rounded MT Bold','Helvetica Neue',Arial,sans-serif"
    font-size="46"
    font-weight="800"
    fill="#111111"
    letter-spacing="-1.5"
  >regbite</text>
</svg>
