{# Help section side-navigation — included by all help pages #}
<nav style="min-width:200px;max-width:200px;border-right:1px solid #EBEBEB;padding-right:1.2rem;">
  <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em;color:#A3A3A3;margin-bottom:0.6rem;">Documentation</div>

  <a href="/help/hub"
     class="sidebar-link{% if active_section == 'hub' %} active{% endif %}"
     style="display:block;padding:0.4rem 0.6rem;font-size:0.85rem;color:#111;text-decoration:none;border-radius:4px;margin-bottom:0.15rem;{% if active_section == 'hub' %}background:#EBEBEB;font-weight:500;{% endif %}">
    Overview
  </a>

  {% for s in sections %}
  <a href="/help/{{ s.slug }}"
     class="sidebar-link{% if active_section == s.slug %} active{% endif %}"
     style="display:block;padding:0.4rem 0.6rem;font-size:0.85rem;color:#111;text-decoration:none;border-radius:4px;margin-bottom:0.15rem;{% if active_section == s.slug %}background:#EBEBEB;font-weight:500;{% endif %}">
    <span style="display:inline-block;width:1.2em;text-align:center;margin-right:0.3rem;color:#A3A3A3;">{{ s.icon }}</span>{{ s.label }}
  </a>
  {% endfor %}

  <div style="border-top:1px solid #EBEBEB;margin:0.8rem 0 0.6rem;"></div>

  <a href="/help/faq"
     class="sidebar-link{% if active_section == 'faq' %} active{% endif %}"
     style="display:block;padding:0.4rem 0.6rem;font-size:0.85rem;color:#111;text-decoration:none;border-radius:4px;{% if active_section == 'faq' %}background:#EBEBEB;font-weight:500;{% endif %}">
    <span style="display:inline-block;width:1.2em;text-align:center;margin-right:0.3rem;color:#A3A3A3;">?</span>FAQ
  </a>
</nav>
