<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — RegBite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="card no-hover" style="padding:2.2rem 2rem;">
      <div style="text-align:center;margin-bottom:1.8rem;">
        <img src="/static/img/logo.png" alt="RegBite" style="height:30px;width:auto;" />
        <p style="margin-top:0.3rem;font-size:0.88rem;">Create your compliance account</p>
      </div>
      {% if error %}
      <div class="error-banner">{{ error }}</div>
      {% endif %}
      <form method="post" action="/register">
        <div class="field">
          <label class="field-label" for="name">Full Name</label>
          <input class="input" type="text" id="name" name="name" placeholder="Regulatory Affairs Manager" required autofocus />
        </div>
        <div class="field">
          <label class="field-label" for="email">Work Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@company.com" required />
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="10+ chars, upper/lower/digit" required minlength="10" />
        </div>
        <p style="margin:-0.25rem 0 0.75rem;font-size:0.78rem;color:#737373;">Use at least 10 characters with an uppercase letter, lowercase letter, and digit.</p>
        <div class="field" style="margin-top:0.75rem;">
          <label style="display:flex;align-items:flex-start;gap:0.5rem;font-size:0.8rem;color:#525252;cursor:pointer;line-height:1.5;">
            <input type="checkbox" name="agree_terms" id="agree_terms" required
                   style="margin-top:0.25rem;width:16px;height:16px;flex-shrink:0;accent-color:#111;cursor:pointer;" />
            <span>I agree to the <a href="/terms" target="_blank" style="font-weight:600;color:#111;">Terms of Service</a>
            and <a href="/privacy" target="_blank" style="font-weight:600;color:#111;">Privacy Policy</a>.
            I understand that RegBite processes label data using AI and is not a substitute for professional legal advice.</span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-xl btn-full" style="margin-top:0.5rem;">Create Account</button>
      </form>
      <p style="text-align:center;margin-top:1.2rem;font-size:0.87rem;">
        Already have an account? <a href="/login" style="font-weight:600;">Sign in</a>
      </p>
    </div>
  </div>
</div>
<script>!function(){var c=document.cookie.match('(^|;)\\s*_csrf=([^;]+)');if(!c)return;var t=decodeURIComponent(c[2]);document.querySelectorAll('form[method="post"],form[method="POST"]').forEach(function(f){if(f.querySelector('input[name="csrf_token"]'))return;var i=document.createElement('input');i.type='hidden';i.name='csrf_token';i.value=t;f.appendChild(i)})}()</script>
</body>
</html>
