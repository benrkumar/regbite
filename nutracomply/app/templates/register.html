<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — RegBite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="card no-hover" style="padding:2.2rem 2rem;">
      <div style="text-align:center;margin-bottom:1.8rem;">
        <div style="font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.03em;">RegBite</div>
        <p style="margin-top:0.3rem;font-size:0.88rem;">Create your compliance account</p>
      </div>
      {% if error %}
      <div class="error-banner">{{ error }}</div>
      {% endif %}
      <form method="post" action="/register">
        <div class="field">
          <label class="field-label" for="name">Full Name</label>
          <input class="input" type="text" id="name" name="name" placeholder="Regulatory Affairs Manager" required autofocus />
        </div>
        <div class="field">
          <label class="field-label" for="email">Work Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@company.com" required />
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="Min 8 characters" required minlength="8" />
        </div>
        <button type="submit" class="btn btn-primary btn-xl btn-full" style="margin-top:0.5rem;">Create Account</button>
      </form>
      <p style="text-align:center;margin-top:1.2rem;font-size:0.87rem;">
        Already have an account? <a href="/login" style="font-weight:600;">Sign in</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
