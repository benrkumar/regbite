<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 — Server Error | RegBite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #F8F8F8; color: #111111;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem 1rem;
      letter-spacing: 0.01em;
    }
    .err-wrap { max-width: 440px; width: 100%; text-align: center; }
    .err-code {
      font-size: 5rem; font-weight: 300; color: #EBEBEB;
      line-height: 1; margin-bottom: 1.25rem; letter-spacing: -0.05em;
    }
    .err-title { font-size: 1.2rem; font-weight: 500; color: #111111; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    .err-desc  { font-size: 0.875rem; color: #737373; line-height: 1.7; margin-bottom: 2rem; }
    .btn-row   { display: flex; gap: 0.65rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.5rem 1.2rem; border-radius: 5px;
      font-size: 0.82rem; font-weight: 500; cursor: pointer;
      text-decoration: none; transition: all 0.12s; font-family: inherit;
      border: 1px solid #D4D4D4; background: #FFFFFF; color: #525252;
    }
    .btn:hover { background: #F5F5F5; color: #111111; }
    .btn-primary { background: #111111; color: #FFFFFF; border-color: #111111; }
    .btn-primary:hover { background: #404040; border-color: #404040; color: #FFFFFF; }
    .err-footer { margin-top: 3rem; font-size: 0.72rem; color: #A3A3A3; }
  </style>
</head>
<body>
  <div class="err-wrap">
    <div class="err-code">500</div>
    <h1 class="err-title">Something went wrong</h1>
    <p class="err-desc">An unexpected error occurred. Please try again — if the problem persists, contact support.</p>
    <div class="btn-row">
      <button class="btn" onclick="history.back()">← Go back</button>
      <a href="/dashboard" class="btn btn-primary">Dashboard →</a>
    </div>
  </div>
  <footer class="err-footer">RegBite &mdash; FSSAI Compliance Monitor</footer>
</body>
</html>
